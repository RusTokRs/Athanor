name: Temporary Security Lock Refresh

on:
  push:
    branches:
      - fix/security-ci-hardening-20260811

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/security-ci-hardening-20260811
          fetch-depth: 0
      - name: Install Rust 1.95
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Refresh vulnerable transitive dependency
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p event-listener --precise 5.4.2
          cargo check --workspace --locked
          git diff --check
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'fix(deps): update event-listener to 5.4.2'
          git push origin HEAD:fix/security-ci-hardening-20260811
