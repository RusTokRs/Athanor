name: DOCGEN Rustok Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docgen-rustok-probe.yml"
      - ".github/actions/setup-rust/**"
      - "apps/ath/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"

permissions:
  contents: read
  statuses: write

env:
  RUSTOK_REVISION: 3b76a530c82c0faaed22ccec384d4fd950811862

jobs:
  probe:
    name: Probe index and generation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      stage: ${{ steps.probe.outputs.stage }}
      code: ${{ steps.probe.outputs.code }}
      message: ${{ steps.probe.outputs.message }}
    steps:
      - name: Check out Athanor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Check out pinned RusTok subset
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RusTokRs/RusTok
          ref: ${{ env.RUSTOK_REVISION }}
          path: target/rustok-evaluation/source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Cargo.toml
            README.md
            modules.toml
            apps/server/Cargo.toml
            apps/server/src/modules
            crates/rustok-modules/Cargo.toml
            crates/rustok-modules/src
            crates/rustok-product/Cargo.toml
            crates/rustok-product/src
            docs/backend/module-backend-architecture.md
            docs/modules/registry.md

      - name: Build Athanor CLI quietly
        shell: bash
        run: cargo build -q -p ath --locked

      - name: Probe exact-snapshot path
        id: probe
        shell: bash
        env:
          SOURCE_ROOT: ${{ github.workspace }}/target/rustok-evaluation/source
        run: |
          set -uo pipefail
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          index_json="$work_dir/index.json"
          index_log="$work_dir/index.log"
          generation_json="$work_dir/generation.json"
          generation_log="$work_dir/generation.log"
          workspace_placeholder="\$WORKSPACE"
          stage=index
          code=0
          message=ok

          if target/debug/ath index "$SOURCE_ROOT" --json > "$index_json" 2> "$index_log"; then
            if snapshot="$(jq -er '.snapshot' "$index_json")"; then
              stage=generate
              if target/debug/ath docs generate-architecture "$SOURCE_ROOT" \
                --snapshot "$snapshot" \
                --max-entities 96 \
                --max-facts 192 \
                --max-relations 192 \
                --max-diagnostics 96 \
                --json > "$generation_json" 2> "$generation_log"; then
                stage=complete
              else
                code=$?
                message="$(tail -n 1 "$generation_log")"
              fi
            else
              code=1
              stage=snapshot
              message="index JSON response does not provide a snapshot"
            fi
          else
            code=$?
            message="$(tail -n 1 "$index_log")"
          fi

          message="$(printf '%s\n' "$message" \
            | sed "s#${GITHUB_WORKSPACE}#$workspace_placeholder#g" \
            | tr '\r\n' '  ' \
            | cut -c1-240)"
          {
            printf 'stage=%s\n' "$stage"
            printf 'code=%s\n' "$code"
            printf 'message=%s\n' "$message"
          } >> "$GITHUB_OUTPUT"

          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

  report:
    name: Report sanitized probe result
    needs: probe
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Print sanitized result
        shell: bash
        env:
          STAGE: ${{ needs.probe.outputs.stage }}
          CODE: ${{ needs.probe.outputs.code }}
          MESSAGE: ${{ needs.probe.outputs.message }}
        run: |
          printf 'stage=%s\ncode=%s\nmessage=%s\n' "$STAGE" "$CODE" "$MESSAGE"

      - name: Publish probe status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          CODE: ${{ needs.probe.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$CODE" = 0 ]; then
            state=success
            description="sanitized evaluation probe succeeded"
          else
            state=failure
            description="sanitized evaluation probe failed"
          fi
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/statuses/$SHA" \
            -d "$(jq -nc --arg state "$state" --arg target_url "$RUN_URL" --arg description "$description" '{state:$state,context:"athanor/rustok-docgen-probe",description:$description,target_url:$target_url}')"
