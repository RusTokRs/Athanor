name: Arena Diagnostic Report

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: arena-diagnostic-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: Report fmt, tests, and Clippy drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Collect rustfmt drift
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git --no-pager diff > /tmp/fmt.diff
          if [ -s /tmp/fmt.diff ]; then
            echo "fmt_drift=present" >> "$GITHUB_ENV"
          else
            echo "fmt_drift=absent" >> "$GITHUB_ENV"
          fi

      - name: Run focused operations extractor tests
        shell: bash
        run: |
          set -euo pipefail
          if cargo test -p athanor-extractor-operations --locked > /tmp/tests.log 2>&1; then
            echo "tests=passed" >> "$GITHUB_ENV"
          else
            echo "tests=failed" >> "$GITHUB_ENV"
          fi
          tail -n 120 /tmp/tests.log > /tmp/tests.tail

      - name: Run focused Clippy
        shell: bash
        run: |
          set -euo pipefail
          if cargo clippy -p athanor-extractor-operations --all-targets --locked -- -D warnings > /tmp/clippy.log 2>&1; then
            echo "clippy=passed" >> "$GITHUB_ENV"
          else
            echo "clippy=failed" >> "$GITHUB_ENV"
          fi
          tail -n 120 /tmp/clippy.log > /tmp/clippy.tail

      - name: Publish diagnostic comment
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "### Arena diagnostic report"
            echo
            echo "- rustfmt drift: ${fmt_drift:-unknown}"
            echo "- focused tests: ${tests:-unknown}"
            echo "- focused clippy: ${clippy:-unknown}"
            if [ "${fmt_drift:-}" = "present" ]; then
              echo
              echo "#### rustfmt diff"
              echo
              echo '```diff'
              cat /tmp/fmt.diff
              echo '```'
            fi
            if [ -f /tmp/tests.tail ]; then
              echo
              echo "#### focused tests output (tail)"
              echo
              echo '```text'
              cat /tmp/tests.tail
              echo '```'
            fi
            if [ -f /tmp/clippy.tail ]; then
              echo
              echo "#### focused clippy output (tail)"
              echo
              echo '```text'
              cat /tmp/clippy.tail
              echo '```'
            fi
          } > /tmp/comment.md
          payload="$(jq -nc --rawfile body /tmp/comment.md '{body: $body}')"
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            -d "$payload"
