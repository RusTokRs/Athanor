name: DOCGEN / Onboarding 5A-5C

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docgen-onboarding-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-focused:
    name: Onboarding focused / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run onboarding profile inventory
        run: cargo test -p athanor-app --test documentation_onboarding_profile_inventory --locked

      - name: Run onboarding publication inventory
        run: cargo test -p athanor-app --test documentation_onboarding_publication_inventory --locked

      - name: Run onboarding operation inventory
        run: cargo test -p athanor-app --test documentation_onboarding_operation_inventory --locked

      - name: Run onboarding inspection inventory
        run: cargo test -p athanor-app --test documentation_onboarding_inspection_inventory --locked

      - name: Run onboarding CLI inventory
        run: cargo test -p ath --test documentation_onboarding_cli --locked
