name: CI rustfmt autofix (temporary)

on:
  push:
    branches: [arena/9b76dc5a-athanor]

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    name: Apply cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: "rustfmt"

      - name: Apply cargo fmt
        run: cargo fmt --all

      - name: Commit and push formatting fixes
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "style: apply cargo fmt (CI autofix)"
            git push origin "$BRANCH"
          else
            echo "no formatting changes"
          fi
