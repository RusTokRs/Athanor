name: Temporary format feedback

# Temporary helper: reports rustfmt / clippy / test results as a PR comment and
# applies rustfmt when the tree is unformatted. Always concludes success so the
# branch is never blocked by this workflow. Delete before merge.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tmp-format-feedback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feedback:
    name: Rust 1.95 / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy rustfmt
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Check formatting
        id: fmt
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > fmt.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ]; then
            cargo fmt --all
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "style: apply rustfmt"
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" \
              pull --rebase origin "${{ github.head_ref }}"
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" \
              push origin HEAD:${{ github.head_ref }}
          fi
          exit 0

      - name: Run Clippy
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings > clippy.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run workspace tests
        id: tests
        shell: bash
        run: |
          set +e
          cargo test --workspace --quiet --locked > tests.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report results
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const tail = (name, lines) => {
              if (!fs.existsSync(name)) return '(no output)';
              const text = fs.readFileSync(name, 'utf8').replace(/\u001b\[[0-9;]*m/g, '');
              const all = text.split('\n');
              return '```\n' + all.slice(Math.max(0, all.length - lines)).join('\n') + '\n```';
            };
            const errors = (name) => {
              if (!fs.existsSync(name)) return '(no output)';
              const text = fs.readFileSync(name, 'utf8').replace(/\u001b\[[0-9;]*m/g, '');
              const lines = text.split('\n');
              let out = [];
              for (let i = 0; i < lines.length && out.length < 120; i++) {
                if (/^(error|warning: unused|warning: unreachable|failures:|---- .* stdout ----|test .* FAILED|thread .* panicked)/.test(lines[i])) {
                  out = out.concat(lines.slice(i, i + 14));
                  out.push('...');
                }
              }
              return out.length ? '```\n' + out.join('\n') + '\n```' : '(no error lines)';
            };
            const fmt = Number(process.env.FMT_CODE);
            const clippy = Number(process.env.CLIPPY_CODE);
            const tests = Number(process.env.TESTS_CODE);
            const body = [
              '## Temporary format feedback',
              '',
              `rustfmt exit code: **${fmt}**`,
              `clippy exit code: **${clippy}**`,
              `cargo test exit code: **${tests}**`,
              '',
              '### rustfmt tail',
              tail('fmt.log', 80),
              '',
              '### clippy errors',
              errors('clippy.log'),
              '',
              '### cargo test errors',
              errors('tests.log'),
              '',
              '### cargo test tail',
              tail('tests.log', 40),
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
        env:
          FMT_CODE: ${{ steps.fmt.outputs.code }}
          CLIPPY_CODE: ${{ steps.clippy.outputs.code }}
          TESTS_CODE: ${{ steps.tests.outputs.code }}
