name: tmp-format-feedback

# Temporary developer feedback loop for the P2J slice. Removed before merge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feedback:
    name: Format and check feedback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Produce the rustfmt diff
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff -- . > "${RUNNER_TEMP}/rustfmt.patch"
          wc -l "${RUNNER_TEMP}/rustfmt.patch"
      - name: Upload rustfmt diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustfmt-patch
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: error
          retention-days: 1
      - name: Restore sources
        run: git checkout -- .
      - name: Run cargo check
        id: check
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets 2>&1 | tee "${RUNNER_TEMP}/cargo-check.log"
      - name: Upload cargo check output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-check-log
          path: ${{ runner.temp }}/cargo-check.log
          if-no-files-found: error
          retention-days: 1
