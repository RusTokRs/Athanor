name: tmp-format-feedback

# Temporary developer feedback loop for the P2J slice. Removed before merge.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  feedback:
    name: Capture rustfmt and cargo check output
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - name: Capture rustfmt diff
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > "$RUNNER_TEMP/fmt.log" 2>&1
          code=$?
          {
            echo "fmt exit code: ${code}"
            cat "$RUNNER_TEMP/fmt.log"
          } > "$RUNNER_TEMP/fmt-body.txt"
          python3 - <<'PY' > "$RUNNER_TEMP/fmt-comment.json"
          import json
          text = open("/home/runner/work/_temp/fmt-body.txt").read()
          print(json.dumps("rustfmt output:\n```\n" + text[:40000] + "\n```"))
          PY
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            --input "$RUNNER_TEMP/fmt-comment.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture cargo check output
        shell: bash
        continue-on-error: true
        run: |
          set +e
          cargo check --workspace --all-targets > "$RUNNER_TEMP/check.log" 2>&1
          code=$?
          {
            echo "check exit code: ${code}"
            tail -n 200 "$RUNNER_TEMP/check.log"
          } > "$RUNNER_TEMP/check-body.txt"
          python3 - <<'PY' > "$RUNNER_TEMP/check-comment.json"
          import json
          text = open("/home/runner/work/_temp/check-body.txt").read()
          print(json.dumps("cargo check output:\n```\n" + text[:40000] + "\n```"))
          PY
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            --input "$RUNNER_TEMP/check-comment.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
