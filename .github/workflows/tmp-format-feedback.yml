name: tmp-format-feedback

# Temporary developer feedback loop for the P2J slice. Removed before merge.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  feedback:
    name: Capture rustfmt, clippy and test output
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: Capture rustfmt diff
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > "$RUNNER_TEMP/fmt.log" 2>&1
          code=$?
          {
            echo "fmt exit code: ${code}"
            cat "$RUNNER_TEMP/fmt.log"
          } > "$RUNNER_TEMP/fmt-body.txt"
          BODY=$(python3 -c 'import json,sys; print(json.dumps("rustfmt output:\n```\n" + open(sys.argv[1]).read()[:40000] + "\n```"))' "$RUNNER_TEMP/fmt-body.txt")
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -f body="$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture clippy output
        shell: bash
        continue-on-error: true
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          code=$?
          {
            echo "clippy exit code: ${code}"
            grep -E "^(error|warning: unused|warning: this)" -A 12 "$RUNNER_TEMP/clippy.log" | head -n 250
          } > "$RUNNER_TEMP/clippy-body.txt"
          BODY=$(python3 -c 'import json,sys; print(json.dumps("clippy output:\n```\n" + open(sys.argv[1]).read()[:40000] + "\n```"))' "$RUNNER_TEMP/clippy-body.txt")
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -f body="$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture test output
        shell: bash
        continue-on-error: true
        run: |
          set +e
          cargo test --workspace > "$RUNNER_TEMP/test.log" 2>&1
          code=$?
          {
            echo "test exit code: ${code}"
            grep -E "^(error|test result|failures:|---- )" -A 12 "$RUNNER_TEMP/test.log" | head -n 400
          } > "$RUNNER_TEMP/test-body.txt"
          BODY=$(python3 -c 'import json,sys; print(json.dumps("test output:\n```\n" + open(sys.argv[1]).read()[:50000] + "\n```"))' "$RUNNER_TEMP/test-body.txt")
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -f body="$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
