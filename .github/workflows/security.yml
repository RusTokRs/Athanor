name: Security Audit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install cargo-audit
        shell: bash
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Cargo.lock
        shell: bash
        run: cargo audit

  unsafe-code:
    name: Enforce unsafe-code policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Check workspace with unsafe code denied
        shell: bash
        run: cargo check --workspace --all-targets --locked --config 'build.rustflags=["-Dunsafe_code"]'
