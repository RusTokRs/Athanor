# cargo-deny configuration

[graph]
# Athanor ships native Linux/Windows binaries and checks native macOS in CI.
# The SurrealDB 4 dependency enables `jsonwebtoken/rust_crypto` only for WASM;
# it pulls vulnerable rsa/crypto-bigint versions, but none of that code is
# built for these native targets. WASM is not a supported Athanor target. If it
# becomes supported, audit it here and remediate its crypto dependencies first.
# Keep all advisories denied for every target we actually build and verify.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
db-path = "~/.cargo/advisories"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0", # webpki-root-certs 1.x Mozilla trust data
    "Unlicense",
    "Zlib",
]
# SurrealDB's published 4.0.0 workspace crates inherit its BUSL-1.1
# license-file. Limit the reviewed exception to this exact release. This is a
# license exception, not an advisory or security-policy exception.
exceptions = [
    { allow = ["BUSL-1.1"], name = "surrealdb", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-catalog", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-cnf", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-collections", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-common", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-core", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-datastore", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-engine-api", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-engine-local", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-expr", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-iam", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-idx", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-keyspace-macro", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-kvs", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-kvs-any", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-kvs-mem", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-kvs-surrealkv", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-observe", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-parse-common", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-parser-next", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-rpc", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-runtime", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-stored-derive", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-strand", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-types", version = "=4.0.0" },
    { allow = ["BUSL-1.1"], name = "surrealdb-types-derive", version = "=4.0.0" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
