openapi: 3.1.0
info:
  title: Athanor Example Auth API
  version: 1.0.0
paths:
  /login:
    post:
      operationId: login
      summary: Authenticate a user
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: example-token
components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    LoginResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
